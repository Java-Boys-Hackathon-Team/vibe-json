name: vibe-json

# Продовый запуск на сервере: поднимается только само приложение.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# База берётся из common-infra - общих сервисов сервера, к которым подключены
# все проекты. Поэтому docker-compose.yml здесь намеренно не подключается:
# описанные в нём postgres и pgadmin нужны только для локальной разработки, где
# проект должен быть самодостаточным.
#
# Параметры подключения и токены лежат в .env.prod рядом с этим файлом,
# права 600, в репозиторий не коммитятся.

services:
  vibe-json:
    build: .
    container_name: vibe-json
    restart: always
    # Именно entrypoint, а не command: в образе задан ENTRYPOINT, и command стал
    # бы набором аргументов приложения, а не новой командой запуска.
    entrypoint: ["java", "-Dspring.config.additional-location=file:/workspace/application-prod.properties", "-jar", "/vibe-json.jar"]
    volumes:
      - './src/main/resources/application-prod.properties:/workspace/application-prod.properties'
    ports:
      # Порт слушается на хосте: reverse proxy ходит в приложение через него.
      - "8081:8080"
      # Служебный порт с метриками; наружу не проброшен, метрики
      # забирает Prometheus по локальной сети.
      - "9081:9081"
    env_file:
      - .env.prod
    environment:
      # Метрики приложения и JVM на служебном порту, отдельном от прикладного:
      # на прикладном они были бы доступны снаружи через обратный прокси, и
      # защита держалась бы на одной строке его конфигурации.
      - MANAGEMENT_SERVER_PORT=9081
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus,metrics
      - MANAGEMENT_METRICS_TAGS_APPLICATION=vibe-json
      # Журнал в JSON: сборщик логов получает готовые поля - уровень, логгер,
      # сообщение, - и фильтр по уровню работает без разбора текста регулярками.
      # Переменной, а не свойством в коде: значение относится к среде запуска,
      # и пересобирать ради него образ незачем.
      - LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash
      - SPRING_PROFILES_ACTIVE=prod
      # За обратным прокси, который терминирует TLS.
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      # Без этого JVM считает доступной память всего сервера и берёт под кучу
      # четверть от неё, не замечая предела контейнера.
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=55
    # Сервер делит память между всеми проектами, поэтому у каждого свой потолок.
    # Ориентир - фактический расход приложения плюс запас на пик сборки мусора.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1280M
    networks: [common-infra]

networks:
  common-infra:
    # Сеть поднята проектом common-infra; здесь она только используется.
    external: true
